<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is nodig voor env(safe-area-inset-bottom): zonder cover is die
      nul en staan de knoppen onderin tegen de home-indicator aan. De vervaagde band
      bovenin komt er niet door; die legt iOS 26 hoe dan ook over de bovenrand, en de
      stylesheet houdt die strook leeg (--glasrand). De statusbalk blijft de gewone,
      dichte balk en neemt de kleur van theme-color aan; WorkoutApp zet die per scherm.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Training" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>Training — werkend wireframe</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Voor setregistratie moet JavaScript aanstaan.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
