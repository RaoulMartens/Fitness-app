<!DOCTYPE html>
<html lang="nl">
<head>

<title>Aanpassen — sheet</title>
<link rel="stylesheet" href="wf.css">
</head>
<body>
<div class="screen">

  <div class="kop">
    <div class="segs">
      <i class="on"></i><i class="on"></i><i class="half"></i>
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="line">
      <span class="big">Chest press</span>
      <span class="sm">Hierna: Zittende row</span>
    </div>
  </div>

  <a href="sessie.html" class="behind" style="text-decoration:none">
    <div class="video"></div>
    <div class="set head"><span>Set</span><span>Vorige</span><span>Kg</span><span>Herh 8&ndash;12</span><span></span></div>
    <div class="set done"><span class="num">W</span><span class="prev">&mdash;</span>
      <span class="in">20</span><span class="in">12</span><span class="tick">✓</span></div>
    <div class="set done"><span class="num">1</span><span class="prev">35 × 10</span>
      <span class="in">35</span><span class="in">11</span><span class="tick">✓</span></div>
    <div class="set now"><span class="num">2</span><span class="prev">35 × 9</span>
      <span class="in">35</span><span class="in">—</span><span class="tick">○</span></div>
  </a>

  <div class="sheet">
    <div class="grip"></div>

    <a href="sessie-aangepast.html" class="opt"><span class="lbl">Later doen</span>
      <span class="eff">Achteraan in de sessie</span></a>
    <a href="oefening-vervangen.html" class="opt"><span class="lbl">Andere oefening</span>
      <span class="eff">Zelfde spieren, ander apparaat</span></a>
  </div>

  <div class="foot"><a href="index.html" style="color:#999">&larr; schermen</a> &middot; aanpassen.html — sheet over sessie</div>
</div>
