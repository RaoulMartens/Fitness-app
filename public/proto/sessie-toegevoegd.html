<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessie — oefening toegevoegd</title>
<link rel="stylesheet" href="wf.css">
</head>
<body>
<div class="screen">

  <div class="kop">
    <div class="segs">
      <i class="on"></i><i class="on"></i><i class="half"></i>
      <i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="line">
      <span class="big">Chest press</span>
      <span class="sm">Nu 8 oefeningen</span>
    </div>
  </div>

  <div class="body">

    <div class="note">Crunch staat achteraan deze sessie, met twee sets.</div>

    <div class="video"></div>

    <div class="set head">
      <span>Set</span><span>Vorige</span><span>Kg</span><span>Herh 8&ndash;12</span><span></span>
    </div>
    <div class="set done">
      <span class="num">W</span><span class="prev">&mdash;</span>
      <span class="in">20</span><span class="in">12</span><span class="tick">&#10003;</span>
    </div>
    <div class="set done">
      <span class="num">1</span><span class="prev">35 &times; 10</span>
      <span class="in">35</span><span class="in">11</span><span class="tick">&#10003;</span>
    </div>
    <div class="set now">
      <span class="num">2</span><span class="prev">35 &times; 9</span>
      <span class="in">35</span><span class="in">&mdash;</span><span class="tick">&#9675;</span>
    </div>

    <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px">
      <a href="sessie-rust.html" class="btn">Set vastleggen</a>
      <div class="links">
        <a href="afronden.html" class="link">Sessie afronden</a>
        <a href="aanpassen.html" class="link">Oefening aanpassen</a>
      </div>
    </div>

  </div>

  <div class="foot"><a href="index.html" style="color:#999">&larr; schermen</a> &middot; sessie-toegevoegd.html &mdash; oefening erbij</div>
</div>
</body>
</html>
