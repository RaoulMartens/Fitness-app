<!doctype html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doel - M4 wireframe</title><style>* { box-sizing:border-box; }
body { margin:0; background:#e0e0e0; color:#333; font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
.prototype-bar,.wf-screen,#storage-error { width:100%; max-width:420px; margin:auto; }
.prototype-bar { display:flex; justify-content:space-between; align-items:center; padding:0 16px; color:#666; font-size:12px; }
.info-button { width:44px; min-height:44px; border:0; background:none; font:italic 20px Georgia,serif; text-align:center; }
.wf-screen { min-height:75dvh; border:1px dashed #bbb; background:#f5f5f5; padding:16px 16px max(24px,env(safe-area-inset-bottom)); }
h1 { margin:20px 0; font-size:26px; line-height:1.22; }
h2 { font-size:19px; line-height:1.35; margin:0 0 12px; }
h3 { font-size:16px; margin:0 0 8px; }
p { margin:8px 0 16px; }
a { color:inherit; }
button,input,textarea { font:inherit; color:inherit; max-width:100%; }
button,a.wf-button { min-height:44px; cursor:pointer; border:1px dashed #999; border-radius:4px; background:white; padding:11px 12px; text-align:left; }
button:active,a.wf-button:active { background:#d4d4d4; }
:focus-visible { outline:3px solid #444; outline-offset:3px; }
.primary,a.primary { background:#ccc; font-weight:600; text-align:center; }
.actions { display:grid; gap:10px; margin-top:24px; }
.text-action { border:0; background:none; text-decoration:underline; color:#555; font-size:14px; }
.wf-nav,.sheet-head { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:13px; }
.wf-nav button { padding:8px 0; }
.steps { display:flex; gap:4px; margin-top:8px; }
.steps span { height:3px; background:#ddd; flex:1; }
.steps .done { background:#666; }
.wf-label,.muted { font-size:14px; color:#666; }
.wf-card { padding:16px; border:1px dashed #bbb; background:#fff; margin:16px 0; }
.wf-card p:last-child { margin-bottom:0; }
fieldset { border:0; margin:0 0 20px; padding:0; min-width:0; }
legend { font-size:14px; color:#555; margin-bottom:8px; }
.choices { display:grid; gap:8px; }
.choice { display:flex; align-items:center; gap:12px; min-height:48px; padding:12px; border:1px dashed #bbb; background:#fff; cursor:pointer; }
.choice:has(input:checked) { background:#e3e3e3; border-color:#666; }
input[type=radio] { width:18px; height:18px; margin:0; accent-color:#444; flex-shrink:0; }
.days { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; }
.days .choice { justify-content:center; padding:10px 0; position:relative; font-size:14px; }
.days input { position:absolute; opacity:0; width:1px; height:1px; }
.days .choice:has(input:focus-visible) { outline:3px solid #444; outline-offset:2px; }
.time-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
.time-options .choice { padding:10px 6px; gap:6px; font-size:14px; }
textarea { width:100%; min-height:96px; resize:vertical; background:white; border:1px dashed #999; padding:12px; }
.notes { display:grid; gap:6px; font-size:14px; }
.week-list,.facts,.exercise-list { list-style:none; margin:0; padding:0; }
.week-list li,.facts li,.exercise-list li { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:13px 0; border-bottom:1px dashed #ccc; }
.week-list small,.facts small { display:block; color:#666; font-size:13px; }
.week-list span:last-child,.exercise-list span { flex-shrink:0; font-size:14px; }
.facts li { display:block; }
.metric-row { display:flex; gap:8px; margin:16px 0; }
.metric-row div { flex:1; background:#e8e8e8; border:1px dashed #bbb; padding:12px; }
.metric-row strong { display:block; font-size:22px; }
.metric-row span { color:#666; font-size:13px; }
details { border-top:1px dashed #bbb; padding:14px 0; }
summary { cursor:pointer; min-height:30px; }
details p { font-size:14px; padding-top:8px; }
.wf-tab-bar { display:flex; gap:12px; border-top:1px dashed #aaa; margin-top:24px; padding-top:12px; }
.wf-tab-bar button { flex:1; text-align:center; }
[aria-current=page] { font-weight:700; background:#ddd; }
.error,#storage-error { border:2px solid #555; background:#fff; padding:12px; }
[hidden] { display:none!important; }
.sheet-head h2 { margin:0; }
.sheet-head { margin-bottom:20px; }
dialog { width:min(100%,420px); max-height:88dvh; margin:auto auto 0; padding:20px 16px max(20px,env(safe-area-inset-bottom)); border:1px dashed #777; border-radius:12px 12px 0 0; background:#f5f5f5; overflow:auto; }
dialog::backdrop { background:rgb(0 0 0 / 35%); }
.wf-link { display:block; padding:11px 0; min-height:44px; }
@media(min-width:500px) { body { padding:20px 0; } dialog { margin:auto; border-radius:8px; } }
@media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }

m</span></label><label class="choice"><input  type="radio" name="focus" value="balanced" aria-label="Geen extra aandachtspunt"  disabled><span>Geen extra aandachtspunt</span></label></div></fieldset></details><div class="actions"><a href="experience.html" class="wf-link wf-button primary">Volgende</a></div></main><footer class="review-meta">goal.html · UC-010</footer></body></html>
