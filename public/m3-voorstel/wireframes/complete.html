<!doctype html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afronden bevestigen - M3 wireframe</title><style>* { box-sizing:border-box; }
body { margin:0; background:#e0e0e0; color:#333; font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
.prototype-bar,.wf-screen { width:100%; max-width:420px; margin:auto; padding:16px; }
.prototype-bar { display:flex; justify-content:space-between; align-items:center; padding:0 16px; font-size:12px; color:#666; }
.info-button { width:44px; border:0; background:none; text-align:center; font-family:Georgia,serif; font-style:italic; }
.wf-screen { min-height:70vh; background:#f5f5f5; border:1px dashed #bbb; padding-bottom:max(24px,env(safe-area-inset-bottom)); }
h1 { font-size:25px; line-height:1.2; margin:18px 0; }
h2 { font-size:21px; line-height:1.3; margin:0; }
h3 { font-size:16px; margin:0 0 8px; }
p { margin:8px 0 14px; }
a { color:inherit; }
button,input { font:inherit; color:inherit; max-width:100%; }
button,.wf-button,.wf-link { cursor:pointer; min-height:44px; padding:11px 12px; border:1px dashed #999; border-radius:4px; background:#fff; text-align:left; }
button:active,a:active { background:#d4d4d4; }
:focus-visible { outline:3px solid #444; outline-offset:3px; }
button:disabled { color:#888; cursor:default; }
.primary,.wf-button { background:#ccc; font-weight:600; text-align:center; }
.group { display:grid; gap:12px; }
.wf-card { padding:14px; border:1px dashed #bbb; background:#fff; margin-bottom:14px; }
.wf-nav,.sheet-head,.wf-tab-bar { display:flex; gap:8px; justify-content:space-between; align-items:center; }
.wf-nav { font-size:12px; }
.wf-nav button { font-size:12px; }
.support-actions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:14px; }
.support-actions button { font-size:13px; text-align:center; padding:10px 4px; background:transparent; }
.text-action { border:0; background:none; color:#666; text-decoration:underline; font-size:13px; padding:12px 0; }
.session-tools { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; font-size:13px; }
.session-tools details { flex:1; }
.session-tools ol { padding-left:20px; }
.prescription { display:flex; gap:12px; margin:0 0 8px; }
.prescription span { flex:1; padding:12px; background:#e8e8e8; border:1px dashed #bbb; }
.prescription strong { display:block; font-size:22px; }
.change-list { display:grid; gap:8px; margin:0; }
.change-list div { display:grid; grid-template-columns:70px 1fr; gap:12px; padding:12px; background:#fff; border:1px dashed #bbb; }
.change-list dt { color:#666; font-size:13px; }
.change-list dd { margin:0; }
.wf-tab-bar { border-top:1px dashed #aaa; margin-top:22px; padding-top:12px; }
.wf-tab-bar button { flex:1; text-align:center; }
[aria-current=page] { font-weight:700; background:#ddd; }
.wf-label,.muted,.wf-footer { color:#666; font-size:13px; }
.wf-footer { margin-top:18px; font-size:11px; }
.fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
label { display:grid; gap:6px; }
input:not([type=checkbox]) { width:100%; padding:12px; border:1px dashed #999; border-radius:3px; background:white; }
.choice { display:flex; gap:10px; align-items:center; min-height:48px; padding:10px; background:white; border:1px dashed #bbb; }
input[type=checkbox] { width:20px; height:20px; }
ul { padding-left:22px; }
li { margin:6px 0; }
.notice { border-left:3px solid #888; padding:8px 12px; background:#e8e8e8; }
.notice p { margin:4px 0; font-size:14px; }
.notice button { padding:8px 0; border:0; background:none; text-decoration:underline; font-size:13px; }
#storage-error { max-width:420px; margin:auto; padding:14px; border:2px solid #555; background:white; }
dialog { width:min(100%,420px); max-height:88dvh; margin:auto auto 0; padding:20px 16px max(20px,env(safe-area-inset-bottom)); border:1px dashed #777; border-radius:12px 12px 0 0; background:#f5f5f5; overflow:auto; }
dialog::backdrop { background:rgb(0 0 0 / 35%); }
.sheet-head { align-items:flex-start; margin-bottom:18px; }
.sheet-head button { flex-shrink:0; }
.sheet-head h2 { padding-top:8px; }
.error { border-left:3px solid #555; padding-left:10px; }
.wf-link { display:block; margin:8px 0; text-decoration:none; }
@media(min-width:500px) { body { padding:20px 0; } dialog { margin:auto; border-radius:8px; } }
@media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }
